# Nginx: serve /okf/ as UTF-8 Markdown, keep it crawlable, keep it out of the index.
# Add inside the tempfind.com server block, before the WordPress location / block.

location ^~ /okf/ {
    types { text/markdown md; }
    default_type text/markdown;
    charset utf-8;
    charset_types text/markdown;
    index index.md;
    autoindex off;
    add_header X-Robots-Tag "noindex" always;
    add_header Cache-Control "public, max-age=3600" always;
    add_header Access-Control-Allow-Origin "*" always;
    try_files $uri $uri/index.md =404;
}
