# Apache: serve /okf/ as UTF-8 Markdown, keep it crawlable, keep it out of the index.
# Place in /okf/.htaccess (the folder is outside WordPress rewrite rules because it exists on disk).
# Requires mod_mime and mod_headers.

AddType "text/markdown; charset=utf-8" .md
AddDefaultCharset utf-8

<IfModule mod_headers.c>
  # Markdown copies duplicate HTML pages; agents can still fetch them.
  Header set X-Robots-Tag "noindex"
  Header set Cache-Control "public, max-age=3600"
  Header set Access-Control-Allow-Origin "*"
</IfModule>

Options -Indexes
DirectoryIndex index.md
